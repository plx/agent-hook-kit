# Patterns are matched against both absolute paths and paths relative to each
# workspace root. Home and project config files are additive.
patterns:
  - ".env"
  - "**/.env"
  - "**/.env.*"
  - "~/.ssh/**"

# inspect_known: inspect recovered candidates and allow unresolved gaps
# deny_unresolved: deny analyzer/resolver gaps as well as concrete matches
# deny_all_shell: deny exact native shell calls
access_policy: deny_unresolved

# Legacy compatibility: true maps to deny_all_shell; false maps to inspect_known.
# block_shell_commands: true
