lowering_policy:
  type: str
  help: How to handle a requested runner message audience a native hook cannot represent.
  choices:
    Best effort with durable warnings: best-effort-with-warnings
    Best effort: best-effort
    Strict (reject unavailable output): strict
  when: "{{ (archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first).runner or 'file_activity' in state_capabilities }}"
  default: >-
    {%- set selected = archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first -%}
    {{ selected.runner.default_lowering_policy if selected.runner else "best-effort-with-warnings" }}
  validator: >-
    {% set selected_harnesses = harnesses if harness_mode == "cross" else [harness] %}
    {% if lowering_policy == "strict" and "antigravity" in selected_harnesses %}
    Strict runner messages are unavailable on Antigravity; choose a best-effort policy.
    {% endif %}

quality_profile:
  type: str
  help: Initial formatter/linter profile for the runner configuration.
  choices:
    Rust: rust
    Python: python
    JavaScript / TypeScript: javascript-typescript
    Go: go
    Custom: custom
  when: "{{ (archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first).runner or 'file_activity' in state_capabilities }}"
  default: >-
    {%- set selected = archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first -%}
    {{ selected.runner.default_quality_profile if selected.runner else "rust" }}

quality_tools:
  type: str
  help: Concrete built-in tools written to the generated Pkl configuration.
  choices: |
    {% if quality_profile == "rust" %}
    Cargo fmt: cargoFmt
    Cargo clippy: cargoClippy
    {% elif quality_profile == "python" %}
    Ruff format: ruffFormat
    Ruff: ruff
    {% elif quality_profile == "javascript-typescript" %}
    Prettier: prettier
    ESLint: eslint
    {% elif quality_profile == "go" %}
    gofmt: gofmt
    go vet: goVet
    {% else %}
    Custom tool seam: custom
    {% endif %}
  multiselect: true
  when: "{{ (archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first).runner or 'file_activity' in state_capabilities }}"
  default: >-
    {%- set selected = archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first -%}
    {%- if selected.runner and quality_profile == selected.runner.default_quality_profile -%}
    {{ selected.runner.default_quality_tools }}
    {%- elif quality_profile == "rust" -%}[cargoFmt, cargoClippy]
    {%- elif quality_profile == "python" -%}[ruffFormat, ruff]
    {%- elif quality_profile == "javascript-typescript" -%}[prettier, eslint]
    {%- elif quality_profile == "go" -%}[gofmt, goVet]
    {%- else -%}[custom]
    {%- endif -%}
  validator: >-
    {% if quality_tools | length == 0 %}
    Select at least one quality tool.
    {% endif %}

quality_config_path:
  type: str
  help: Package-owned Pkl policy path; kept inside this crate to avoid collisions.
  when: "{{ (archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first).runner or 'file_activity' in state_capabilities }}"
  default: "{{ crate_path }}/config/{{ package_name }}.pkl"
  validator: >-
    {% set config_prefix = crate_path ~ "/config/" %}
    {% if not quality_config_path.startswith(config_prefix)
          or quality_config_path.endswith('/')
          or '//' in quality_config_path
          or (quality_config_path | regex_search('(^|/)\.\.?(/|$)'))
          or not (quality_config_path | regex_search('^[A-Za-z0-9._/-]+\.pkl$')) %}
    Keep the policy under {{ crate_path }}/config/ with safe path components and a .pkl filename.
    {% endif %}

reconciliation_posture:
  type: str
  help: File reconciliation behavior when an exact session boundary is unavailable.
  choices:
    Best effort: best-effort
    Strict: strict
  when: "{{ ((archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first).runner and (archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first).runner.kind == 'deferred') or 'file_activity' in state_capabilities }}"
  default: >-
    {%- set selected = archetype_catalog.archetypes | selectattr('stable_id', 'equalto', starter) | first -%}
    {{ selected.runner.default_reconciliation_posture if selected.runner and selected.runner.default_reconciliation_posture else "best-effort" }}
