aligned_hooks:
  type: str
  help: Select only lifecycle families implemented for every chosen harness.
  choices: |
    {% for family in alignment_catalog.alignments %}
    {% set availability = namespace(ok=true) %}
    {% for selected_harness in harnesses %}
    {% if selected_harness not in family.supported_harnesses %}
    {% set availability.ok = false %}
    {% endif %}
    {% endfor %}
    {% if availability.ok %}
    {{ family.display_name | tojson }}: {{ family.stable_id | tojson }}
    {% endif %}
    {% endfor %}
  multiselect: true
  when: "{{ harness_mode == 'cross' }}"
  default: >-
    {%- set selected = namespace(value=none) -%}
    {%- for archetype in archetype_catalog.archetypes -%}
    {%- if archetype.stable_id == starter -%}{%- set selected.value = archetype -%}{%- endif -%}
    {%- endfor -%}
    [
    {%- set defaults = selected.value.default_cross_hooks or selected.value.required_hooks -%}
    {%- for required in defaults -%}
    {%- for family in alignment_catalog.alignments -%}
    {%- if family.stable_id == required -%}{{ required | tojson }},{%- endif -%}
    {%- endfor -%}
    {%- endfor -%}
    ]
  validator: >-
    {% if harness_mode == 'cross' %}
    {% set selected = namespace(value=none, missing=[]) %}
    {% for archetype in archetype_catalog.archetypes %}
    {% if archetype.stable_id == starter %}{% set selected.value = archetype %}{% endif %}
    {% endfor %}
    {% for required in selected.value.required_hooks %}
    {% if required not in aligned_hooks %}{% set selected.missing = selected.missing + [required] %}{% endif %}
    {% endfor %}
    {% set managed_state = namespace(values=[]) %}
    {% if starter == "session_bootstrap" %}{% set managed_state.values = managed_state.values + ["session_metadata"] %}{% endif %}
    {% set custom_state = namespace(values=[]) %}
    {% for capability in state_capabilities %}
    {% if capability not in managed_state.values %}{% set custom_state.values = custom_state.values + [capability] %}{% endif %}
    {% endfor %}
    {% set custom_handler = namespace(available=false) %}
    {% for hook in aligned_hooks %}
    {% set managed_owned = starter == "session_bootstrap" and hook == "session_start" %}
    {% if not managed_owned %}{% set custom_handler.available = true %}{% endif %}
    {% endfor %}
    {% if aligned_hooks | length == 0 %}
    Select at least one aligned hook family.
    {% elif selected.missing %}
    {{ selected.value.display_name }} requires aligned hooks: {{ selected.missing | join(", ") }}.
    {% elif custom_state.values and not custom_handler.available %}
    Custom state capabilities {{ custom_state.values | join(", ") }} require at least one selected hook with a user-owned handler seam; add pre-tool or another compatible family.
    {% endif %}
    {% endif %}

native_hooks:
  type: str
  help: Select exact native command-hook contracts for the chosen harness.
  choices: |
    {% for event in event_catalog.events %}
    {% if event.harness == harness %}
    {{ (event.display_name ~ " (" ~ event.wire_event ~ ")") | tojson }}: {{ event.stable_id | tojson }}
    {% endif %}
    {% endfor %}
  multiselect: true
  when: "{{ harness_mode == 'single' }}"
  default: >-
    {%- set selected = namespace(value=none) -%}
    {%- for archetype in archetype_catalog.archetypes -%}
    {%- if archetype.stable_id == starter -%}{%- set selected.value = archetype -%}{%- endif -%}
    {%- endfor -%}
    [
    {%- set defaults = selected.value.default_single_hooks or selected.value.required_hooks -%}
    {%- for required in defaults -%}
    {%- for event in event_catalog.events -%}
    {%- if event.harness == harness and event.stable_id == required -%}{{ required | tojson }},{%- endif -%}
    {%- endfor -%}
    {%- endfor -%}
    ]
  validator: >-
    {% if harness_mode == 'single' %}
    {% set selected = namespace(value=none, missing=[]) %}
    {% for archetype in archetype_catalog.archetypes %}
    {% if archetype.stable_id == starter %}{% set selected.value = archetype %}{% endif %}
    {% endfor %}
    {% for required in selected.value.required_hooks %}
    {% if required not in native_hooks %}{% set selected.missing = selected.missing + [required] %}{% endif %}
    {% endfor %}
    {% set managed_state = namespace(values=[]) %}
    {% if starter == "scoped_context_once" %}{% set managed_state.values = managed_state.values + ["session_metadata", "claim_once"] %}{% endif %}
    {% set custom_state = namespace(values=[]) %}
    {% for capability in state_capabilities %}
    {% if capability not in managed_state.values %}{% set custom_state.values = custom_state.values + [capability] %}{% endif %}
    {% endfor %}
    {% set custom_handler = namespace(available=false) %}
    {% for hook in native_hooks %}
    {% set managed_owned = starter == "scoped_context_once" and hook == "pre_tool_use" %}
    {% if not managed_owned %}{% set custom_handler.available = true %}{% endif %}
    {% endfor %}
    {% if native_hooks | length == 0 %}
    Select at least one native command hook.
    {% elif selected.missing %}
    {{ selected.value.display_name }} requires native hooks: {{ selected.missing | join(", ") }}.
    {% elif custom_state.values and not custom_handler.available %}
    Custom state capabilities {{ custom_state.values | join(", ") }} require at least one selected native hook with a user-owned handler seam.
    {% endif %}
    {% endif %}
