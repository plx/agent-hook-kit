project_name:
  type: str
  help: Human-readable project name.
  placeholder: Acme hooks
  validator: >-
    {% if not (project_name | trim) %}
    Project name must not be empty.
    {% endif %}

package_name:
  type: str
  help: Stable Cargo package, answers-file, workflow, and state namespace; rename by migration/recopy only.
  default: >-
    {{ project_name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('(^-+|-+$)', '') }}
  validator: >-
    {% set rust_name = package_name | replace('-', '_') %}
    {% set reserved = [
      "as", "async", "await", "break", "const", "continue", "crate", "dyn",
      "else", "enum", "extern", "false", "fn", "for", "gen", "if", "impl",
      "in", "let", "loop", "match", "mod", "move", "mut", "pub", "ref",
      "return", "self", "static", "struct", "super", "trait", "true", "try",
      "type", "unsafe", "use", "where", "while", "yield", "abstract", "become",
      "box", "do", "final", "macro", "override", "priv", "typeof", "unsized",
      "virtual", "alloc", "core", "proc_macro", "std", "test", "build", "deps",
      "examples", "incremental", "clap", "serde", "serde_json", "hookkit_core",
      "hookkit_runtime", "hookkit_common", "hookkit_claude", "hookkit_codex",
      "hookkit_antigravity", "hookkit_session_state", "hookkit_file_activity",
      "hookkit_tool_access"
    ] %}
    {% if not (package_name | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) or package_name | length > 64 %}
    Use at most 64 lowercase letters, digits, and single dashes; start with a letter.
    {% elif rust_name in reserved %}
    Choose a package name whose Rust crate identifier is not reserved and does not collide with a generated dependency.
    {% endif %}

binary_name:
  type: str
  help: Installed command and registration identity; rename by migration/recopy only.
  default: "{{ package_name }}"
  validator: >-
    {% if not (binary_name | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) or binary_name | length > 64 %}
    Use at most 64 lowercase letters, digits, and single dashes; start with a letter.
    {% endif %}

crate_path:
  type: str
  help: Stable relative owned path for the generated CLI crate; move by migration/recopy only.
  default: "crates/{{ package_name }}"
  validator: >-
    {% if crate_path.startswith('/')
          or crate_path.endswith('/')
          or '//' in crate_path
          or (crate_path | regex_search('(^|/)\.\.?(?:/|$)'))
          or not (crate_path | regex_search('^[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$')) %}
    Use a relative path with nonempty safe components and no `.` or `..`.
    {% endif %}

description:
  type: str
  help: Cargo package and README description.
  default: "{{ project_name }} hooks built with agent-hook-kit"
  validator: >-
    {% if not (description | trim) %}
    Description must not be empty.
    {% endif %}

license:
  type: str
  help: License expression written to Cargo metadata.
  choices:
    MIT or Apache 2.0: MIT OR Apache-2.0
    MIT: MIT
    Apache 2.0: Apache-2.0
  default: MIT OR Apache-2.0
