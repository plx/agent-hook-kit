        codex: codex/commit-ff6aec9-r2/PermissionRequest
      portable_floor:
        input: Exact native permission-request arms plus harness, workspace roots, tool name, and tool input.
        output: Allow or deny with a reason; Claude input and permission rewrites are intentionally outside the floor.
      capabilities:
        input_rewrite: false
        true_pre_action_block: true
        post_action_feedback: false
        tool_result: false
        separate_user_agent_messages: false
        exact_session_boundary: false
    - stable_id: pre_compact
      display_name: Before compaction
      order: 50
      runtime_marker: hookkit_runtime::aligned::PreCompact
