        codex: codex/commit-ff6aec9-r2/Stop
      portable_floor:
        input: Exact native stop input arms plus harness and workspace roots.
        output: Allow completion or continue execution with one portable reason; message audiences remain native-specific.
      capabilities:
        input_rewrite: false
        true_pre_action_block: true
        post_action_feedback: false
        tool_result: false
        separate_user_agent_messages: false
        exact_session_boundary: false
    - stable_id: permission_request
      display_name: Permission request
