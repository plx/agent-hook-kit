        claude-code: claude-code/docs-2026-09-30-r1/PostCompact
        codex: codex/commit-ff6aec9-r2/PostCompact
      portable_floor:
        input: Exact native post-compaction arms plus trigger; only Claude carries the compact summary.
        output: No-op or a portable system notice, which only Codex shows; Claude Code discards PostCompact output.
