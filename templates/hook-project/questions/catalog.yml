alignment_catalog:
  type: yaml
  when: false
  default:
    format_version: 1
    alignments:
    - stable_id: pre_tool
      display_name: Before tool use
      order: 10
      runtime_marker: hookkit_runtime::aligned::PreToolUse
      supported_harnesses:
      - claude-code
      - codex
      - antigravity
      native_members:
        antigravity: antigravity/docs-2026-09-30-r1/PreToolUse
        claude-code: claude-code/docs-2026-09-30-r1/PreToolUse
        codex: codex/commit-ff6aec9-r2/PreToolUse
      portable_floor:
        input: Exact native input arms plus harness, workspace roots, tool name, and tool input views.
        output: Explicit native allow or deny with a reason; native-only decisions and rewrites remain arm-specific.
      capabilities:
        input_rewrite: false
        true_pre_action_block: true
        post_action_feedback: false
        tool_result: false
        separate_user_agent_messages: false
        exact_session_boundary: false
    - stable_id: post_tool
      display_name: After tool use
      order: 20
      runtime_marker: hookkit_runtime::aligned::PostToolUse
      supported_harnesses:
      - claude-code
      - codex
      - antigravity
      native_members:
        antigravity: antigravity/docs-2026-09-30-r1/PostToolUse
        claude-code: claude-code/docs-2026-09-30-r1/PostToolUse
        codex: codex/commit-ff6aec9-r2/PostToolUse
      portable_floor:
        input: Exact native input arms plus harness and workspace roots; result and message fidelity is arm-specific.
        output: Exact native output arm selected by the handler; the universal safe response is no-op.
      capabilities:
        input_rewrite: false
        true_pre_action_block: false
        post_action_feedback: false
        tool_result: false
        separate_user_agent_messages: false
        exact_session_boundary: false
