[package]
name = "hookkit-tool-runner"
description = "Pkl-driven immediate and session-batched tool runners for agent-hook-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "post-tool-use-agent-hook"
path = "src/bin/post-tool-use-agent-hook.rs"

[[bin]]
name = "turn-completion-agent-hook"
path = "src/bin/turn-completion-agent-hook.rs"

[[bin]]
name = "session-start-state-agent-hook"
path = "src/bin/session-start-state-agent-hook.rs"

[[bin]]
name = "file-activity-agent-hook"
path = "src/bin/file-activity-agent-hook.rs"

[dependencies]
camino = { workspace = true }
clap = { workspace = true }
globset = { workspace = true }
hookkit-common = { workspace = true }
hookkit-core = { workspace = true }
hookkit-file-activity = { workspace = true }
hookkit-antigravity = { workspace = true }
hookkit-claude = { workspace = true }
hookkit-codex = { workspace = true }
hookkit-pkl-config = { workspace = true }
hookkit-runtime = { workspace = true }
hookkit-session-state = { workspace = true }
minijinja = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { workspace = true }
