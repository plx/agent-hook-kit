  - CLI release notes through 1.5.16, first cited by this supplement, not vendored; the hash covers the decoded 268726-byte body of the raw file at the commit that antigravity/docs-2026-11-25-r1 pins, and a re-fetch for this supplement on 2026-11-25 returned the same bytes. Line numbers below refer to that body.
  - '"## 1.5.3" (line 271): "Added the `PLUGIN_ROOT` and `PLUGIN_DATA` environment variables to hook commands that come from a plugin, pointing to the plugin''s folder and its persistent data folder"; the same entry says `agy plugin validate` no longer warns that they are not set for hooks. "## 1.5.6" (line 226) makes `agy plugin validate` warn when a plugin hook command uses ${PLUGIN_ROOT} or $PLUGIN_ROOT, "which older CLI versions do not set", and suggest a relative path "since hooks already run in the plugin''s folder". "## 1.3.2" (line 580) introduced a per-plugin data folder "available as PLUGIN_DATA" without naming the processes that receive it, so the hook floor is 1.5.3.'
  - The variables are unprefixed and no entry adds CLAUDE_* aliases for them, so a PLUGIN_ROOT and PLUGIN_DATA pair inherited from an outer process, such as a Codex plugin hook (Codex sets the same two names), is indistinguishable from one Antigravity set. "## 1.4.11" (line 351) expands `${CLAUDE_PLUGIN_ROOT}` once, when `agy plugin import claude` converts a Claude Code plugin's MCP servers; it sets no variable for hook commands.
  - Other variables named in the CLI release notes either configure the CLI itself (for example AGY_CLI_HIDE_LOGO, AGY_ADC_AUTH, ANTIGRAVITY_DISABLE_EMBEDDED_RIPGREP, CLI_GRAPHICS, GEMINI_API_KEY, and GOOGLE_GEMINI_BASE_URL) or are set for the agent's own shell commands (PAGER, GIT_PAGER, and, since 1.3.3, JJ_PAGER; GIT_EDITOR, HGEDITOR, and JJ_EDITOR since 1.3.6; PYTHONUTF8 on Windows since 1.5.1). No entry documents any of them for hook commands, so none is modeled.
