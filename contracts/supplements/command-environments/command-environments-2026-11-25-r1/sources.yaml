  - It supersedes the retrieval that command-environments-2026-09-30-r2 pinned (sha256 2ec613e87106d52bcba2883e4b58c222ce622676f4b14fee0db9c89eb2f8c270), which was never captured. Its environment-variable section still lists CLAUDE_PLUGIN_ROOT, CLAUDE_PLUGIN_DATA, CLAUDE_PROJECT_DIR, and CLAUDE_PLUGIN_OPTION_<KEY> for hook commands (line 569) and exports CLAUDE_PLUGIN_OPTION_<KEY> to hook processes for every option (line 495).
- id: claude-plugin-components
  kind: official-documentation
  authority: primary
  url: https://code.claude.com/docs/en/plugins/components.md
  retrieved: 2026-11-25
  content_sha256: 1737d81c9c68f055970b0b78cf621946644daf940bda65a8c3125d4b35ae5d1b
  reproducibility: content-hash-only
  limitations:
  - The mutable Markdown page has no checked-in capture; the hash covers the decoded 38271-byte body returned by `curl --fail --silent --show-error --location --compressed`. It supersedes the retrieval that command-environments-2026-09-30-r2 pinned (sha256 97fa2babb277ddb65be0d85aad1a3099d1ca34ffdf193ed98be1ce7270408fed), which was never captured.
  - It states that every plugin hook process receives CLAUDE_PLUGIN_ROOT and CLAUDE_PLUGIN_DATA, plus CLAUDE_PLUGIN_OPTION_<KEY> for each user configuration value (line 364). A plugin agent's `hooks` frontmatter is ignored (line 314); the page does not say whether hooks declared in a plugin skill's frontmatter receive the plugin variables.
