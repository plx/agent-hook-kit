- id: claude-hooks-reference
  kind: official-documentation
  authority: primary
  url: https://code.claude.com/docs/en/hooks.md
  retrieved: 2026-11-25
  content_sha256: d16003851f60562eaa793e6270316b17550f8e24691214d7d798e5a503537c79
  reproducibility: content-hash-only
  limitations:
  - The mutable Markdown page has no checked-in capture; the hash covers the decoded 301732-byte body returned by `curl --fail --silent --show-error --location --compressed`, the retrieval that claude-code/docs-2026-11-25-r1 pins. A re-fetch for this supplement on 2026-11-25 returned the same bytes. Line numbers below refer to that body.
  - It supersedes the retrieval that command-environments-2026-09-30-r2 and claude-code/docs-2026-09-30-r1 pinned (sha256 5129d58370ed4d7910c6e86537e0592b2902ea5bf0a8682721c5484f5d46f566, 248570 bytes), which was never captured; the difference was reviewed against what that supplement encodes and planning/audits/2026-11-25-claude-code-hooks.md. The environment statements it cited are unchanged - CLAUDE_ENV_FILE for exactly SessionStart, Setup, CwdChanged, and FileChanged (line 1445), CLAUDE_PROJECT_DIR and the plugin path exports in exec and shell form (line 493), CLAUDE_PLUGIN_OPTION_<KEY> for shell-form plugin hooks (line 497), CLAUDE_CODE_REMOTE and CLAUDE_CODE_BRIDGE_SESSION_ID (line 417), and parent-environment inheritance (line 777). The common-input table now also says that $CLAUDE_EFFORT holds the effort.level value (line 763).
  - CwdChanged and FileChanged exports to CLAUDE_ENV_FILE persist only until the next CwdChanged event, when Claude Code clears them (lines 3193 and 3313); SessionStart and Setup exports persist for the session. No sentence promises that CLAUDE_ENV_FILE is set, and the reference examples guard it with `[ -n "$CLAUDE_ENV_FILE" ]`.
  - CLAUDE_ENV_FILE is also unavailable to a hook that runs in PowerShell, through "shell" set to "powershell" or by default on Windows without Git Bash, even on the four events above (line 1445); the `shell` field is ignored for an exec-form hook (line 459). The environment-file profile is optional, so its absence there is expected. Since Claude Code v2.1.296, PowerShell tool commands receive the file's variables only when every line, across what the session's hooks wrote and any script the user set CLAUDE_ENV_FILE to before launch, is blank, a comment, or a plain assignment, never in a sandboxed PowerShell command, and on Windows not for a value that contains `/` or `\` (lines 1434-1441).
  - PreSkillShellCommand (Claude Code v2.1.332 or later) is documented without an environment rule of its own (lines 1659-1730). Its event_profiles entry, the PreToolUse profiles without environment-file, is inferred from the event-independent statements (handlers run with Claude Code's environment, line 415; the environment reference's rows for hook commands name no event) and from the four-event CLAUDE_ENV_FILE rule; a plugin may define the hook (line 1669), so the plugin profiles apply.
  - A hook process inherits the parent environment apart from the OTEL_* exporter variables, the credentials that CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 strips, and, in a session with the HIPAA configuration, Anthropic credentials (line 777), so any profile variable can also appear as inherited ambient state. There is no $CLAUDE_MODEL variable (line 775).
- id: claude-environment-reference
  kind: official-documentation
  authority: primary
  url: https://code.claude.com/docs/en/env-vars.md
  retrieved: 2026-11-25
  content_sha256: 30cd22fe95a40ced8d175d368d5e915441014255f40965e681d2a3dcbdff317e
  reproducibility: content-hash-only
  limitations:
  - The mutable Markdown page has no checked-in capture; the hash covers the decoded 194781-byte body returned by `curl --fail --silent --show-error --location --compressed`. Line numbers below refer to that body.
  - It supersedes the retrieval that command-environments-2026-09-30-r2 pinned (sha256 f49dad1f82b0207d81e5a011ad119db820ac35f05b88ffb7828e5d668ae47b1a, 156688 bytes), which was never captured, so the difference was reviewed against the rows that supplement models. The rows for CLAUDECODE (line 191), CLAUDE_CODE_BRIDGE_SESSION_ID (222), CLAUDE_CODE_CHILD_SESSION (225, now also naming Monitor tool subprocesses), CLAUDE_CODE_MESSAGING_SOCKET and CLAUDE_CODE_MESSAGING_TOKEN (349-350), CLAUDE_CODE_PROPAGATE_TRACEPARENT (381, TRACEPARENT for hook subprocesses), CLAUDE_CODE_REMOTE and CLAUDE_CODE_REMOTE_SESSION_ID (384-385), CLAUDE_CODE_SESSION_ID (400), CLAUDE_EFFORT (455), CLAUDE_ENV_FILE (459), and CLAUDE_PID (461) still match the profiles. Apart from CLAUDE_JOB_DIR (below), no other row names a variable that Claude Code sets in the environment of hook commands.
  - CLAUDE_PID requires Claude Code v2.1.214, CLAUDE_CODE_MESSAGING_SOCKET v2.1.224, CLAUDE_CODE_MESSAGING_TOKEN v2.1.228, CLAUDE_CODE_BRIDGE_SESSION_ID v2.1.199, and CLAUDE_CODE_CHILD_SESSION v2.1.172; older releases omit them.
  - CLAUDE_PID is documented as Claude Code's own process ID without a stated format; the metadata language has no integer value kind, so the profile records it as opaque. Claude Code never exports a value that is not a positive decimal process ID, so consumers treat any other value as inherited state and ignore it rather than failing the hook.
  - The CLAUDE_ENV_FILE row (line 459) also lets a user set the variable before launch, to a script that Claude Code runs before each Bash command. Neither this page nor the hooks reference says whether a hook then receives that path, so a value on one of the four environment-file events does not prove that Claude Code created the file, and a value on any other event is inherited state.
  - CLAUDE_JOB_DIR (line 460) is set for each background session, and shell commands that the session runs inherit it, so a hook can inherit it too; it is session state rather than a hook variable and is not modeled. CLAUDE_CODE_SHELL_PREFIX (line 402) is user configuration that wraps hook commands other than PowerShell and exec-form hooks; it is not hook state.
- id: claude-plugins-reference
  kind: official-documentation
