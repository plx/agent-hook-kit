  reproducibility: content-hash-only
  limitations:
  - The mutable Markdown page has no checked-in capture; the hash covers the decoded 37464-byte body returned by `curl --fail --silent --show-error --location --compressed`. It supersedes the retrieval that command-environments-2026-09-30-r2 pinned (sha256 886e6885d8702664ac582edfa129ffc21e103370982beba15c3782cadcaf3620), which was never captured.
  - It still states that a session that starts with messaging on exports CLAUDE_CODE_MESSAGING_SOCKET before any hook runs, including SessionStart (lines 248-249), and exports CLAUDE_CODE_MESSAGING_TOKEN alongside it (line 255); the token is therefore modeled as its own profile, conditional on the socket, rather than as an independent variable.
- id: claude-cloud-environments
  kind: official-documentation
