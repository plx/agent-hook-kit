format_version: 1
# Claude Code docs-2026-11-25-r1 catalogs `"onFailure": "block"` as the
# command-on-failure-block binding on these events. hookkit-claude tests its
# typed outputs against that binding's cases, but no native descriptor
# declares the binding and hookkit-conformance does not execute its cases.
# The binding's stabilization default is catalog-only. The HTTP bindings are
# unsupported by scope, so they are not gaps.
gaps:
  - harness: claude-code
    snapshot: docs-2026-11-25-r1
    event: ConfigChange
    binding: command-on-failure-block
    assertion: binding-implemented
    rationale: The ConfigChange descriptor declares only the command binding, so the command-on-failure-block process cases are not executed.
    owner: hookkit-claude
    removal_phase: 6
