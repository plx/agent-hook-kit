format_version: 1
release: stabilization-v1
defaults:
  - harness: antigravity
    binding: command
    level: catalog-only
    verification: source-reviewed
  - harness: claude-code
    binding: command
    level: catalog-only
    verification: source-reviewed
  # Preserve documented HTTP contracts in the protocol ledger, but do not
  # treat non-command bindings as HookKit implementation targets.
  - harness: claude-code
    binding: http
    level: unsupported
    verification: source-reviewed
  # The `-on-failure-block` bindings model `"onFailure": "block"`, which turns
  # a failing hook into a block. hookkit-claude checks its typed outputs
  # against the command-on-failure-block cases, but no native descriptor
  # declares that binding and conformance does not execute its cases, so it
  # stays a catalog entry. HTTP stays out of scope, as above.
  - harness: claude-code
    binding: command-on-failure-block
    level: catalog-only
    verification: source-reviewed
  - harness: claude-code
    binding: http-on-failure-block
    level: unsupported
    verification: source-reviewed
  - harness: codex
    binding: command
    level: catalog-only
    verification: source-reviewed
