format_version: 1
release: stabilization-v1
defaults:
  - harness: antigravity
    binding: command
    level: catalog-only
    verification: source-reviewed
  - harness: claude-code
    binding: command
    level: catalog-only
    verification: source-reviewed
  # Preserve documented HTTP contracts in the protocol ledger, but do not
  # treat non-command bindings as HookKit implementation targets.
  - harness: claude-code
    binding: http
    level: unsupported
    verification: source-reviewed
  - harness: codex
    binding: command
    level: catalog-only
    verification: source-reviewed
  - harness: gemini-cli
    binding: command
    level: catalog-only
    verification: source-reviewed
