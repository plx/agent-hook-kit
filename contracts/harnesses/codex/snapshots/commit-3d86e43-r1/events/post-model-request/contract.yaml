uncertainties:
- PostModelRequest (Codex >= 0.164.0) reports the outcome of each attempt to open a model response stream as `completed`, `failed`, or `cancelled`.
- 'Observation-only: Codex never parses stdout, at any exit code. Plain text, invalid JSON, and JSON that looks like a control directive, such as `{"continue":false,"decision":"block"}`, are only debug-logged; no output can block, veto, or change the model request or its context.'
- 'Status rules from the pinned source, which the schema does not encode: `completed` has a null `error` and the response''s `response_id`, with `token_usage` the provider usage or null; `failed` carries the error''s display text in `error` (for example `stream disconnected before completion: stream closed before response.completed` when the stream ends early), and only an incomplete response (`Incomplete response returned, reason: ...`) also carries `response_id` and `token_usage`, which are null for every other failure; `cancelled` (a turn abort, an interrupt, or an attempt dropped before it settled) has all three null. `token_usage` always includes `cache_write_input_tokens` although the schema marks it optional.'
- A synchronous PostModelRequest handler holds back the attempt's terminal event (completed or error) and, under `response_process_mode` `AfterCompleteResponse`, its buffered items until it finishes; in the default mode streaming output and tool dispatch proceed. When the turn stops waiting, unfinished synchronous runs are marked stopped (`Hook cancelled because the turn was interrupted`). An attempt dropped before it settled schedules its `cancelled` PostModelRequest on the background executor even for synchronous handlers; that run shares the eight-hook background limit and is aborted at shutdown, so it may never happen.
- 'A synchronous, non-executor `mcp_tool` handler whose run completes may price a billable attempt (`completed`, or `failed` with `token_usage`) by returning `structuredContent` `{"extra_codex_rollout_budget_units": <finite number >= 0>}` (default 0); a non-object, a wrong type, or a negative or non-finite value is an invalid price that makes usage posting fail, while sibling prices are kept. Command handlers can never price, so stdout such as `{"extra_codex_rollout_budget_units":3}` is ignored. The hooks reference does not document pricing.'
- Each call that opens a model response stream runs one PreModelRequest and PostModelRequest pair; transport recovery within that call does not start another pair, and no pair starts once the rollout budget is exhausted. `request_id` (a UUID) is shared by the retries and model fallbacks of one generation, and `attempt_number` counts its opens from 1, although the generated schema allows 0. The pair's lifecycle id is not serialized, so hooks can correlate the two events only by (`request_id`, `attempt_number`). PostModelRequest runs without a PreModelRequest when only post handlers are configured.
- '`kind` is `sampling` for turn requests and `foreground_compaction` for compaction requests; `background_compaction` comes only from the under-development `AsyncCompaction` feature (off by default), whose requests can run before PreCompact, possibly for a discarded compaction candidate. The value set already grew in 0.171.0, so consumers should accept unknown kinds.'
- The payload carries no `permission_mode`. `cwd` is the step's local-environment cwd, falling back to the turn cwd. `thread_id` names the issuing thread, and `agent_id` and `agent_type` (which falls back to the default role name) are present only for thread-spawned subagents, where `agent_id` equals `thread_id`. `kind`, `request_id`, `attempt_number`, `thread_id`, and PostModelRequest `response_id` were added in 0.171.0; the hooks reference documents only the earlier field set, and the pinned generated schema controls.
- Memory-consolidation turns run only managed-source and executor-scoped model-request handlers; user, project, session-flag, plugin, and environment-scoped hooks do not run there.
- 'Unlike every other Codex input schema, the generated schema declares no `additionalProperties: false`, because the input struct flattens its event enum without `deny_unknown_fields`; the serialized key set is nonetheless closed. This contract derives one event''s schema from the shared file''s matching `oneOf` branch and keeps the vendored openness and the `attempt_number` minimum of 0.'
- The official generated schemas include parsed compatibility fields; runtime support restrictions from the hooks reference and pinned source remain controlling.
- 'Unlike every other Codex event, trimmed non-blank stderr becomes an error entry at every exit code, including 0: an exit-0 run is completed but shows its stderr, so exit-0 outcomes model stderr as diagnostics. A runtime error written to stderr is therefore visible on every model request attempt.'
- Every non-zero exit, exit 2 included, and a process that dies without an exit status is a failed run with no other effect; Codex adds no `hook exited with code N` text, so a failed run with blank stderr has no output entries. A timeout, spawn error, or plugin trust error adds its own error entry.
- 'Codex ignores any configured `matcher` for this event, and ignores `additionalContextLimit` with a load warning. `async: true` is honored, and background runs deliver their error entries too. The timeout defaults to 600 seconds, with a minimum of 1 and no clamp.'
- 'Codex also runs `mcp_tool` handlers, synchronously unless they are executor-scoped (those always run in the background), and ignores the tool result''s text like command stdout; `isError: true` fails the run. Since 0.164.0 a hook call waits for its MCP server and may start a dormant one within the hook timeout; since 0.171.0 bundled App hooks must target the host Apps server, and the connector and current policy must allow automatic execution. `prompt` and `agent` handlers are parsed but skipped. Only the command binding is modeled.'
- Since Codex 0.149.0 locally executed command hooks receive a replay of the environment Codex captured when the session hook registry was created, not the live environment; since 0.155.0 they start in a new session without a controlling terminal and their timeout also covers stdin delivery. On timeout, I/O failure, or turn abort Codex SIGKILLs the hook's whole process group.
- Codex does not dispatch command hooks for Work threads that use cloud orchestration, even when tools execute locally; only admin-managed Global `mcp_tool` hooks run there, never environment-scoped hooks or SessionEnd MCP hooks.
- 'Since Codex 0.165.0 managed hooks declared by an execution environment''s requirements (environment-scoped hooks) also run for this event. Codex rewrites their stdin without marking the scope: `cwd` becomes the environment''s cwd in its native form, and `transcript_path` (and `agent_transcript_path`, where present) becomes null even when the session has a transcript. They run on the environment''s executor through the exec server, in the environment''s shell (on Windows only PowerShell, which pipes the stdin line to the command, with its trailing newline and encoding unverified; cmd is rejected), under its `shell_environment_policy` without an environment replay, with the exec server''s credential scrub and no plugin variables; stdout and stderr are each silently capped at 1 MiB, and one deadline covers launch, stdin, and output.'
- Since Codex 0.164.0 a non-builtin plugin hook with a saved approval re-hashes its whole plugin bundle before every run (synchronous, background, or `mcp_tool`) unless `--dangerously-bypass-hook-trust` is set, and the scan counts against the hook timeout. A changed declaration or bundle content, a symlink or special entry (including a symlinked plugin root), a file that changes during the scan, or a scan timeout records a failed run with an error entry and no exit code, without launching the hook, and the operation continues (fail-open). The hooks reference says changed hooks are skipped until trusted, but at runtime they fail on every match.
- '`session_id` is the root session identity that every descendant thread shares (the hooks reference says the parent session id), so on a subagent thread it names the root session, not the subagent; `agent_id` identifies a thread-spawned subagent.'
