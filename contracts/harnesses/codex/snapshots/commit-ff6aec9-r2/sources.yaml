    retrieved: 2026-09-30
    content_sha256: 724881d81f1a9fdb35ea42d4851a11b1f6606bbc6e9d2d05c1e8c466fc25c630
    reproducibility: content-hash-only
    limitations:
      - The mutable Markdown endpoint has no checked-in capture; the hash covers the decoded 46,965-byte body of `curl --fail --silent --show-error --location --compressed https://learn.chatgpt.com/docs/hooks.md`, unchanged since commit-ff6aec9-r1 (https://developers.openai.com/codex/hooks.md served identical bytes), and cannot be re-verified after the page changes.
      - The page is the release behavior reference but lags the pinned release, omitting the SessionStart `fork` source and still describing the session cwd for tool hooks; the pinned generated schemas and source control where they disagree.
      - Its PermissionRequest section says the reserved `updatedInput`, `updatedPermissions`, and `interrupt` fields "fail closed"; the pinned source discards the handler's whole decision instead, which the PermissionRequest contract records.
