snapshot: commit-ff6aec9-r2
uncertainties:
- 'Since Codex 0.157.0 `cwd` and the process working directory are the step''s local-environment cwd when one is selected (falling back to the turn cwd), so they can differ from the cwd reported by turn-scoped events; the hooks reference still says the session cwd. Since 0.156.0 `model` and `permission_mode` come from the step''s captured settings (PermissionRequest: the review context) and can change within a turn.'
- Exit 2 selects the exit-2 outcome only when stderr is non-empty after trimming; exit 2 with empty or whitespace-only stderr is a failed run (failure outcome) and has no blocking effect.
- A structured deny whose message is missing, empty, or whitespace-only is still a denial; Codex substitutes `PermissionRequest hook denied approval`.
- 'The hooks reference calls `updatedInput`, `updatedPermissions`, and `interrupt` reserved fields that fail closed, but the pinned source treats them like `continue: false`, `stopReason`, and `suppressOutput`: any of them (`interrupt` only when `true`) fails the run and discards that handler''s whole decision, allow or deny alike. Unless another matching hook decides, Codex falls back to the normal approval flow (Guardian review or the user prompt), so such an allow is not auto-approved and such a deny, for example a Claude Code style deny with `interrupt: true`, is not enforced.'
- The official generated schemas include parsed compatibility fields; runtime support restrictions from the hooks reference and pinned source remain controlling.
- Codex never reads stderr from a command that exits 0, so exit-0 outcomes model stderr as ignored rather than as diagnostics.
- For non-zero exits that do not select a blocking outcome Codex records only `hook exited with code N`, discards stderr, and continues (fail-open); a process that dies without an exit status is also a failed run.
- 'Command handlers with `async: true` (Codex >= 0.148.0) run in the background: Codex ignores every control effect (decision, permissionDecision, updatedInput, PermissionRequest decisions, continue:false, stopReason, and exit 2), treats exit 2 as a plain failure, and delivers only additionalContext and systemMessage at the next safe point. The stdin payload carries no execution-mode marker, so these outcomes describe synchronous handlers.'
- Codex >= 0.148.0 also runs `mcp_tool` handlers, always synchronously, and parses a successful tool result like exit-0 stdout; `prompt` and `agent` handlers are parsed but skipped. Only the command binding is modeled.
- Since Codex 0.149.0 command hooks receive a replay of the environment Codex captured when the session hook registry was created, not the live environment; since 0.155.0 they start in a new session without a controlling terminal and their timeout also covers stdin delivery. On timeout, I/O failure, or turn abort Codex SIGKILLs the hook's whole process group.
- Codex does not dispatch command hooks for Work threads that use cloud orchestration, even when tools execute locally; only admin-managed remote mcp_tool hooks run there.
