snapshot: docs-2026-11-25-r1
uncertainties:
- 'Two exit-2 rows are narrower than exit-2: exit 2 with nothing on stdout and stderr saying a file is missing, such as No such file or directory, is a non-blocking error (exit-2-missing-file, listed before exit-2; any stdout other than whitespace disables the rule), and a JSON object with continue false printed with exit 2 ends the turn instead of continuing it (exit-2-continue-false, listed before exit-2-structured; what happens to stderr then is undocumented).'
- background_tasks[].type is a friendly label such as shell, subagent, monitor, workflow, teammate, cloud session, or MCP task; since Claude Code 2.1.329 a Monitor's script is labeled monitor rather than shell, and command is present for shell tasks and monitor tasks that run a command. Agent SDK 0.3.332 still documents command as shell-only, so the SDK and the reference disagree.
- background_tasks and session_crons are scoped to the parent session, not the subagent.
- Since Claude Code 2.1.331 SubagentStop waits for the subagent's last reply to reach its transcript (changelog only).
- Before Claude Code 2.1.311, SubagentStop hooks could run about twice a minute for each running subagent instead of once when it finished (changelog only); the changelog does not say which releases had the bug.
- agent_type, which the matcher filters on, is the frontmatter name for a custom subagent and the plugin-scoped identifier such as my-plugin:reviewer for a plugin's subagent; the colon puts such a matcher on the regular-expression path, so it must be anchored (^my-plugin:reviewer$) to match exactly. For the built-in web-fetch subagent, Claude Code runs these hooks from managed settings only.
- Internal agents such as prompt suggestions and /btw side questions also fire SubagentStop with agent_type set to the session's agent name or an empty string; the reference does not say whether agent_id and agent_transcript_path are always present for them, so both remain required. A matcher that names agent types does not match an empty agent_type, while an omitted matcher, "", "*", or a regular expression that matches the empty string does.
- 'last_assistant_message is optional: since Claude Code v2.1.271 a subagent using SubagentHandback delivers its report through that tool and the field holds only closing text, if any, and the Agent SDK types the field optional.'
- 'SubagentStop uses the Stop decision control: decision block with a reason, or exit-2 stderr, keeps the subagent running and becomes its next instruction.'
- 'hookSpecificOutput.additionalContext is non-error feedback that keeps Claude working: like decision block it continues the conversation, subject to the stop_hook_active input and the 8-consecutive-continuation cap (CLAUDE_CODE_STOP_HOOK_BLOCK_CAP), but the transcript labels it hook feedback rather than a hook error.'
- The reference requires reason when decision is block, so the output schema requires it; it does not require the reason to be non-empty.
- Exit status 2 is described only by the exact exit-2 outcomes; the 1-255 nonzero outcomes model the reference's other exit codes and apply to status 2 only where no exit-2 outcome exists.
- 'A hook that runs in PowerShell (shell: powershell, or a shell-form hook on Windows without Git Bash) did not take the exit-2 outcomes before Claude Code v2.1.309, nor before v2.1.316 when its command begins with a type cast, param, using, or an attribute.'
- The reference gives no version for the missing-file exit-2 rule and does not say how stderr is matched. Inspection of the Claude Code 2.1.285 and 2.1.332 CLI builds during the audit, not cited as a source, suggests that the rule predates the 2.1.285 snapshot (the 2.1.327 changelog entry about a Stop hook that failed to run changed only how it is shown), that it applies when stdout is empty after trimming whitespace and stderr matches no such file or can't open case-insensitively, and that it is skipped, so exit 2 still blocks, when the hook's stdio was cut before end of stream; exit-2-missing-file therefore allows whitespace-only stdout, and its stderr semantic format names that match.
- An HTTP connection failure has no status and is a non-blocking error, and a timeout cancels the hook, so neither is an outcome here; how Claude Code handles a 3xx status is undocumented, so non-success covers only 400-599.
- onFailure has no effect on Stop, SubagentStop, TaskCompleted, and TeammateIdle hooks, because exit code 2 there sends Claude back to keep working and Claude cannot repair a hook that won't run, so these outcomes hold whatever onFailure is set to.
- For a hook that isn't async, stdout counts as JSON output only when it is one JSON object with nothing around it but whitespace. Anything that does not start with { and end with } is plain text, including a JSON array or a quoted JSON string. Two or more lines that each parse as JSON, the first starting with { and the last ending with }, are plain text when no line is a JSON output object that sets a field, and a parse failure (invalid-json) when one is; the stdout semantic formats of the exit-0 plain-text outcome and of invalid-json name those two cases.
- 'Each additionalContext, systemMessage, and initialUserMessage string, and plain stdout measured whole, is capped at 10,000 characters per hook (since Claude Code v2.1.89): longer output is saved to a file in the session directory and replaced by the file path and a preview of up to 2,000 characters, Claude is not asked to read the file, and the cap has no setting. The schemas set no maxLength because longer text is accepted and spilled.'
- Since Claude Code v2.1.292, a <system-reminder> or </system-reminder> tag in a hook string reaches Claude with that tag's < replaced by &lt;.
- Claude Code 2.1.332 shortens text over about 50,000 characters when a hook blocks or fails during a turn with a very large log (changelog only); which text it cuts, and where, is not documented.
- 'These bindings model synchronous command hooks. A command hook that sets async or asyncRewake is not modeled: decision fields such as decision, permissionDecision, and continue have no effect; after it exits, additionalContext and systemMessage reach Claude on the next turn and are not shown to the user; its JSON must be alone on stdout or on a line of its own (spanning several lines requires v2.1.295 or later), and a field with the wrong type is dropped on its own; Claude Code does not enforce timeout on async hooks but does on asyncRewake hooks; an asyncRewake exit 2 wakes Claude at once with stderr, or stdout when stderr is empty; and onFailure and terminalSequence do not apply.'
- A hook that isn't async and leaves a background process holding its stdout or stderr takes up to 10 seconds to finish after its own process exits, and output printed after Claude Code stops reading is discarded. The reference states the resulting block (stdio went quiet; refusing to honor the suspect capture) only for a PreToolUse allow; whether it applies on this event is unknown.
