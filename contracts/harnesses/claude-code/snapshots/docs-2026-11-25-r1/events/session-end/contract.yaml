uncertainties:
- bypass_permissions_disabled was removed in Claude Code v2.1.234 and is no longer sent; it stays in the enum because older releases may still send it.
- Claude Code discards SessionEnd JSON output fields such as systemMessage; terminalSequence is documented to keep working on events that discard those fields.
- Exit status 2 shows stderr to the user only. Claude Code ignores the JSON of an event that discards hook output on any exit code apart from side-effect fields such as terminalSequence, which still fire; the reference states this by example (StopFailure), so nonzero exits are split into nonzero-structured (terminal-sequence-only) and nonzero-unstructured. Whether the stderr notice is still shown when the JSON is schema-valid is undocumented.
- terminalSequence is emitted only while an interactive interface is open, which may no longer hold when the session ends.
- SessionEnd hooks share a 1.5-second budget when the user exits, runs /clear, or switches sessions with interactive /resume. A per-hook timeout raises the budget to the highest such timeout in the settings files, up to 60 seconds, but timeouts on plugin-provided hooks do not raise it, and a hook without its own timeout keeps the default; CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS overrides the budget and becomes the timeout of each hook without its own. Before Claude Code 2.1.300, SessionEnd hooks sometimes did not run when the user exited while a background command was still running (changelog only).
- An HTTP connection failure has no status and is a non-blocking error, and a timeout cancels the hook, so neither is an outcome here; how Claude Code handles a 3xx status is undocumented, so non-success covers only 400-599.
- 'The outcomes describe onFailure unset or continue. onFailure: block (Claude Code v2.1.295 or later; mcp_tool hooks v2.1.328 or later; ignored for async and asyncRewake command hooks) makes a failure do what exit code 2 does on this event, which is the same notice, log line, or failure as a non-blocking error, so no modeled outcome changes and no on-failure-block binding is cataloged. The reference does not say whether such a failure is reported differently.'
- Claude Code 2.1.332 shortens text over about 50,000 characters when a hook blocks or fails during a turn with a very large log (changelog only); which text it cuts, and where, is not documented.
- 'These bindings model synchronous command hooks. A command hook that sets async or asyncRewake is not modeled: decision fields such as decision, permissionDecision, and continue have no effect; after it exits, additionalContext and systemMessage reach Claude on the next turn and are not shown to the user; its JSON must be alone on stdout or on a line of its own (spanning several lines requires v2.1.295 or later), and a field with the wrong type is dropped on its own; Claude Code does not enforce timeout on async hooks but does on asyncRewake hooks; an asyncRewake exit 2 wakes Claude at once with stderr, or stdout when stderr is empty; and onFailure and terminalSequence do not apply.'
- A hook that isn't async and leaves a background process holding its stdout or stderr takes up to 10 seconds to finish after its own process exits, and output printed after Claude Code stops reading is discarded. The reference states the resulting block (stdio went quiet; refusing to honor the suspect capture) only for a PreToolUse allow; whether it applies on this event is unknown.
