uncertainties:
- A command hook returns the path as the last non-empty stdout line after Claude Code strips ANSI escape codes, so earlier lines such as shell banners are ignored; a command hook cannot return JSON, so terminalSequence is unavailable to it.
- A relative path is resolved against the directory the hook ran in, collapsing . and .. segments. An absolute path that contains . or .. segments, or any path that passes through a symlink below the repository root, is refused, and the error names the rejected component. The reference states this rule without a version; the v2.1.216 floor recorded by earlier snapshots is no longer supported by it. Since Claude Code 2.1.325, EnterWorktree also refuses a path through a symlink inside the project (changelog only).
- If the resolved path is not a directory Claude Code can enter, the session prints an error naming the path and exits with code 1.
- Claude Code acts on the hook's success and returned path and discards systemMessage and continue. A failed HTTP hook, or a 2xx response without worktreePath, fails creation under the same contract as a command hook.
- Configuring the hook replaces the default git worktree behavior, so .worktreeinclude is not processed.
- WorktreeCreate runs when a session starts with claude --worktree, when Claude creates and enters a worktree with EnterWorktree, for a subagent with isolation worktree, and, newly listed by the reference with no version, when a workflow runs an agent in its own worktree, when Claude Code isolates a background session in its own worktree, and when claude remote-control in worktree mode starts a session. A hook-created worktree for a subagent or workflow agent is kept when the agent finishes, with no WorktreeRemove.
- A plugin's WorktreeCreate hook runs with --worktree only since Claude Code v2.1.300 and still does not run when Claude Code is launched with --worktree and --tmux, because the worktree is created before plugins load; a plugin hook's seed-directory case was fixed in 2.1.325 (changelog only). A WorktreeCreate hook never runs for git worktree add through Bash.
- The HTTP outcomes cover a non-2xx status and a 2xx response that yields no worktreePath (missing-path); the reference does not say whether a 2xx JSON object that carries worktreePath but otherwise fails the output schema also fails creation, so no schema-invalid-body outcome is cataloged. An HTTP connection failure has no status and a timeout cancels the hook; both are failures here. Any non-2xx status is a failure, so failed covers 300-599; whether Claude Code follows a redirect before it judges the status is undocumented.
- 'The outcomes describe onFailure unset or continue. onFailure: block (Claude Code v2.1.295 or later; mcp_tool hooks v2.1.328 or later) makes a failure do what exit code 2 does on this event, and any nonzero exit or other failure already fails worktree creation, so no modeled outcome changes and no on-failure-block binding is cataloged.'
- These bindings model synchronous command hooks; a command hook that sets async or asyncRewake cannot return the worktree path, and onFailure and terminalSequence do not apply to it.
- A hook that isn't async and leaves a background process holding its stdout or stderr takes up to 10 seconds to finish after its own process exits, and output printed after Claude Code stops reading is discarded; whether the PreToolUse suspect-capture block applies on this event is unknown.
