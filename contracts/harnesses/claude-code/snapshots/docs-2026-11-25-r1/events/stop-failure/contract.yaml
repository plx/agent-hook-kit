uncertainties:
- error includes verification_required and overloaded, which the Agent SDK 0.3.332 SDKAssistantMessageError type lists but the hooks reference does not document. The reference's error list and StopFailure matcher list now omit overloaded and report an HTTP 529 overloaded response as server_error; overloaded stays in the closed enum because releases that send it may still exist.
- Matching cloud_credential_error requires Claude Code v2.1.267 or later; earlier releases reported credential-load failures as server_error or unknown.
- Claude Code ignores the hook's output and exit code apart from terminalSequence.
- 'An HTTP hook applies this event''s failure contract from the per-event exit-code table: a non-2xx status, or a 2xx body that is neither empty nor a JSON object, has the effect of a failed command hook rather than the generic non-blocking error. The reference exempts events with their own failure contract from the generic HTTP results, which make a 2xx JSON object that fails the output schema a non-blocking error, so such a body (schema-invalid-body) is assumed to take the same failure effect, as invalid JSON from a command hook does.'
- An HTTP connection failure has no status and takes this event's failure effect (a non-blocking error on most events), and a timeout cancels the hook, so neither is an outcome here. Any non-2xx status is a failure, so non-success covers 300-599; whether Claude Code follows a redirect before it judges the status is undocumented.
- 'The outcomes describe onFailure unset or continue. onFailure: block (Claude Code v2.1.295 or later; mcp_tool hooks v2.1.328 or later; ignored for async and asyncRewake command hooks) makes a failure do what exit code 2 does on this event. For a hook that cannot start, a timeout, invalid JSON, or a nonzero exit without schema-valid JSON, that is the same notice, log line, or no-op as a non-blocking error, so no on-failure-block binding is cataloged. nonzero-structured does change: a schema-valid JSON object printed with an exit code other than 0 or 2 counts as a failure (this event''s exit-2 row) instead of a success, and whether its fields, including terminalSequence, still apply and how that failure is reported are undocumented.'
- For a hook that isn't async, stdout counts as JSON output only when it is one JSON object with nothing around it but whitespace. Anything that does not start with { and end with } is plain text, including a JSON array or a quoted JSON string. Two or more lines that each parse as JSON, the first starting with { and the last ending with }, are plain text when no line is a JSON output object that sets a field, and a parse failure (invalid-json) when one is; the stdout semantic formats of the exit-0 plain-text outcome and of invalid-json name those two cases.
- Claude Code ignores this event's JSON output apart from side-effect fields such as terminalSequence, and the reference does not say whether exit-0 stdout that cannot be parsed or fails schema validation is still reported here as the generic exit-0 rule's non-blocking error. It is assumed to be a failure that, like a nonzero exit, takes this event's failure effect from the per-event row, so invalid-json and an HTTP schema-invalid-body share that effect.
- Claude Code 2.1.332 shortens text over about 50,000 characters when a hook blocks or fails during a turn, or after /compact, with a very large log (changelog only); which text it cuts, and where, is not documented.
- 'These bindings model synchronous command hooks. A command hook that sets async or asyncRewake is not modeled: decision fields such as decision, permissionDecision, and continue have no effect; after it exits, additionalContext and systemMessage reach Claude on the next turn and are not shown to the user; its JSON must be alone on stdout or on a line of its own (spanning several lines requires v2.1.295 or later), and a field with the wrong type is dropped on its own; Claude Code does not enforce timeout on async hooks but does on asyncRewake hooks; an asyncRewake exit 2 wakes Claude at once with stderr, or stdout when stderr is empty; and onFailure and terminalSequence do not apply.'
- A hook that isn't async and leaves a background process holding its stdout or stderr takes up to 10 seconds to finish after its own process exits, and output printed after Claude Code stops reading is discarded. The reference states the resulting block (stdio went quiet; refusing to honor the suspect capture) only for a PreToolUse allow; whether it applies on this event is unknown.
