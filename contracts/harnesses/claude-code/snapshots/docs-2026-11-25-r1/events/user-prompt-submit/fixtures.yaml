    origin: synthesized
    sources:
    - claude-hooks-reference
    value:
      cwd: /repo
      hook_event_name: UserPromptSubmit
      prompt: /deploy staging
      session_id: s1
      transcript_path: /tmp/t.jsonl
  - id: sdk-source
    origin: synthesized
    sources:
    - claude-agent-sdk-types
    value:
      cwd: /repo
      hook_event_name: UserPromptSubmit
      prompt: Run the tests
      session_id: s1
      source: loop_wakeup
      transcript_path: /tmp/t.jsonl
  - id: poll-event-source
    origin: synthesized
    sources:
    - claude-agent-sdk-types
    - claude-code-mode
    value:
      cwd: /repo
      hook_event_name: UserPromptSubmit
      prompt: 'Background job finished: 3 tests failed.'
      session_id: s1
      source: poll_event
      transcript_path: /tmp/t.jsonl
