snapshot: docs-2026-11-25-r1
uncertainties:
- 'Claude Code reads only the exit code: exit 0 counts as removed, and a nonzero exit fails the removal when worktree_path still exists afterward, leaving the worktree on disk with no git fallback. A hook that deleted the directory before exiting nonzero counts as removed, and after exit 0 Claude Code does not fall back to git if the directory remains.'
- The decision-control summary says WorktreeRemove JSON output is discarded, so stdout is modeled as ignored; the exit-code section now states as a rule for every event that discards hook output that side-effect fields such as terminalSequence still fire on any exit code, which conflicts with that summary for this event.
- 'A failed removal is reported where it was requested: for a background-session delete, the session stays and agent view reports how the hook ended (such as exited 1), quotes the start of stderr, and says whether deleting again removes the directory anyway; for claude remote-control cleanup, its terminal shows worktree removal failed, kept: <path>. The reference no longer says the stderr goes to the debug log.'
- 'An HTTP hook applies the same failure contract: a non-2xx status, or a 2xx body that is neither empty nor a JSON object, fails the removal when the directory remains. The reference does not say whether a 2xx JSON object that fails the universal output schema also counts as a failure. A connection failure has no status and a timeout cancels the hook, so neither is an outcome here; whether either fails the removal when the directory remains is undocumented, and so is whether Claude Code follows a redirect before it judges the status, so failed covers 300-599.'
- 'WorktreeRemove fires only for a worktree a WorktreeCreate hook created: when the user exits an interactive worktree session and chooses removal; when an unnamed interactive worktree session exits and git finds no changed or untracked files, without a prompt (since Claude Code 2.1.301 quitting no longer removes one that may hold unpushed commits without asking, changelog only); when a background session in the worktree is deleted; when Claude removes it with ExitWorktree, which refuses a hook-created worktree unless Claude passes discard_changes: true; and, without a prompt, when a claude remote-control worktree-mode session ends without crashing, or remote control is stopped, and git finds no changed or untracked files and no new commits. It does not fire when a subagent or workflow agent finishes; their hook-created worktrees are kept.'
- Claude Code looks for changed or untracked files with git, so a worktree that is not a git checkout looks clean and can be removed without a prompt even when it holds uncommitted work. Claude Code never deletes a branch belonging to a hook-created worktree.
- For a background-session delete, Claude Code verifies the stored worktree path before running the hook, refusing a path that is a symlink or passes through one below the repository root, and runs the hook for a worktree that still contains files only after the user confirms the delete in agent view; claude rm keeps such a session and worktree instead.
- 'Without any WorktreeRemove hook, Claude Code removes the WorktreeCreate path as git worktree remove --force would when the user exits a worktree session or Claude calls ExitWorktree, so a worktree git does not recognize stays on disk; claude remote-control cleanup keeps the worktree and reports worktree removal failed, kept: <path>; a background-session delete follows agent view''s rules.'
- A plugin's WorktreeCreate and WorktreeRemove hooks run with --worktree only since Claude Code v2.1.300 and still not with --worktree and --tmux (changelog only for WorktreeRemove; the reference explains the WorktreeCreate case by Claude Code creating the worktree before it loads plugins).
- 'The outcomes describe onFailure unset or continue. onFailure: block (Claude Code v2.1.295 or later; mcp_tool hooks v2.1.328 or later; ignored for async and asyncRewake command hooks) makes a failure do what exit code 2 does on this event, and any nonzero exit already fails the removal when the directory remains; under block, a timeout or a hook that cannot start, which no exit selector expresses, fails it the same way. No modeled outcome changes, so no on-failure-block binding is cataloged.'
- 'These bindings model synchronous command hooks. A command hook that sets async or asyncRewake is not modeled: decision fields such as decision, permissionDecision, and continue have no effect; after it exits, additionalContext and systemMessage reach Claude on the next turn and are not shown to the user; its JSON must be alone on stdout or on a line of its own (spanning several lines requires v2.1.295 or later), and a field with the wrong type is dropped on its own; Claude Code does not enforce timeout on async hooks but does on asyncRewake hooks; an asyncRewake exit 2 wakes Claude at once with stderr, or stdout when stderr is empty; and onFailure and terminalSequence do not apply.'
- A hook that isn't async and leaves a background process holding its stdout or stderr takes up to 10 seconds to finish after its own process exits, and output printed after Claude Code stops reading is discarded. The reference states the resulting block (stdio went quiet; refusing to honor the suspect capture) only for a PreToolUse allow; whether it applies on this event is unknown.
