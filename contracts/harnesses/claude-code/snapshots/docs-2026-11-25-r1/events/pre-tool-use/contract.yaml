id: claude-code/docs-2026-11-25-r1/PreToolUse
schemas:
  input:
    assurance:
      confidence: low
      verification: source-reviewed
    file: input.schema.json
    origin: derived
    sources:
    - claude-hooks-reference
    - claude-agent-sdk-types
  outputs:
  - assurance:
