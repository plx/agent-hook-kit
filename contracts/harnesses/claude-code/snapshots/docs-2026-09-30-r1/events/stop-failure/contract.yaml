uncertainties:
- error includes verification_required, which the Agent SDK SDKAssistantMessageError type lists but the hooks reference does not document.
- Matching cloud_credential_error requires Claude Code v2.1.267 or later; earlier releases reported credential-load failures as server_error or unknown.
- Claude Code ignores the hook's output and exit code apart from terminalSequence.
- 'An HTTP hook applies this event''s failure contract from the per-event exit-code table: a non-2xx status, or a 2xx body that is neither empty nor a JSON object, has the effect of a failed command hook rather than the generic non-blocking error.'
