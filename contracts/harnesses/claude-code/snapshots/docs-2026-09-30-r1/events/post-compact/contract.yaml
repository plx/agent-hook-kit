uncertainties:
- systemMessage and continue are discarded; terminalSequence is documented to keep working on events that discard those fields.
- Exit status 2 shows stderr to the user only; the reference does not say whether terminalSequence fires on a nonzero exit, so nonzero exits are modeled as one outcome.
