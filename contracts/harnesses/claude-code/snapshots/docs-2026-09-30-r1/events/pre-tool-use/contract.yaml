uncertainties:
- mcp_server (Claude Code v2.1.274 or later) is present only for MCP tools; its source vocabulary is open, the schema lists the documented values as examples, and an unrecognized source must be treated as an unrecognized configured source rather than sdk.
- 'permission_mode and effort.level are open strings: the reference lists their current values, which the schema keeps as examples, but the Agent SDK types both as string, and effort may gain members.'
- 'updatedInput is documented only together with a permissionDecision: allow auto-approves the rewritten input, ask shows it to the user, and defer ignores it. Whether Claude Code applies updatedInput without a permissionDecision is undocumented.'
- permissionDecisionReason is shown to Claude for deny, to the user for ask, and written only to the debug log for allow and defer.
- A timed-out command, http, or mcp_tool hook does not block the tool call.
- The deprecated top-level decision and reason (approve or block) are still mapped by Claude Code but are intentionally omitted in favor of hookSpecificOutput.
- Exit status 2 is described only by the exact exit-2 outcomes; the 1-255 nonzero outcomes model the reference's other exit codes and apply to status 2 only where no exit-2 outcome exists.
