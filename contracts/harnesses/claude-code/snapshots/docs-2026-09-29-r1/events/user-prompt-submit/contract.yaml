uncertainties:
- reason and exit-2 stderr are shown to the user and are not added to Claude's context.
- The pinned reference describes suppressOriginalPrompt only for decision block; a later, unpinned revision of the reference (retrieved 2026-09-30) says it also applies when an exit-2 hook prints it, and that an exit-2 hook printing no JSON always keeps the prompt text in the block message.
- prompt carries pasted text expanded in place; when Claude Code marks pasted text, it sits between pasted_content id marker lines.
- Stdout whose trimmed text starts with { and ends with } is parsed as JSON (Claude Code v2.1.248 or later); a parse or schema-validation failure is a non-blocking error and the text is not added as context. Output of two or more lines that each parse as JSON, none setting an output field, remains plain text.
- Exit status 2 is described only by the exact exit-2 outcomes; the 1-255 nonzero outcomes model the reference's other exit codes and apply to status 2 only where no exit-2 outcome exists.
