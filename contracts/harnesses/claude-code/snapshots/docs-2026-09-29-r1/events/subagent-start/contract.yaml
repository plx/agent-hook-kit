uncertainties:
- SubagentStart fires on spawn, on subagent resume, and for each message an in-process teammate handles; repeated context is injected only when the subagent context no longer holds the earlier copy.
- Exit status 2 renders stderr as a hook error notice in the subagent's own transcript; Claude does not see it.
