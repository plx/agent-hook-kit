uncertainties:
- retry true only tells the model it may retry; Claude Code ignores it for no-verdict denials.
- The exit-code table says exit code and stderr are ignored because the denial already occurred; other nonzero codes are modeled the same way.
- mcp_server (Claude Code v2.1.274 or later) is present only for MCP tools; its source vocabulary is open, the schema lists the documented values as examples, and an unrecognized source must be treated as an unrecognized configured source rather than sdk.
