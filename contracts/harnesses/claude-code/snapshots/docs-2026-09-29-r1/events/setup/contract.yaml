uncertainties:
- Claude Code discards every Setup JSON output field, including hookSpecificOutput.additionalContext, on every exit code; the Agent SDK output union still types Setup additionalContext, so the schema omits hookSpecificOutput as documented.
- Only command handlers run on Setup. The handler-support list still names mcp_tool, but a configured mcp_tool Setup hook is always skipped, so it is omitted from handler_kinds.
- terminalSequence is emitted only by an interactive session with its interface on screen; Setup fires only for --init-only or non-interactive -p runs, so every field is modeled as ignored.
- Exit code and stderr are ignored; with -p and --output-format stream-json --verbose they appear only as hook_response events.
