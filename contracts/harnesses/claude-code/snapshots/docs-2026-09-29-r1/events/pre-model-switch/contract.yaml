uncertainties:
- PreModelSwitch requires Claude Code v2.1.251 or later and runs only for switches a user or client requested, not for automatic fallback or restore on resume.
- A hook canceled at its timeout blocks the switch.
- ask is treated as a refusal everywhere except interactive /model; precedence across hooks is deny over ask over allow.
- systemMessage is shown to the user regardless of the decision; permissionDecisionReason is shown for deny and ask and ignored for allow. The reference does not say where a top-level reason is shown when decision is block.
- The matcher compares the canonical name derived from to_model, ignoring any [1m] suffix; when no canonical name can be derived every hook runs.
- Exit status 2 is described only by the exact exit-2 outcomes; the 1-255 nonzero outcomes model the reference's other exit codes and apply to status 2 only where no exit-2 outcome exists.
