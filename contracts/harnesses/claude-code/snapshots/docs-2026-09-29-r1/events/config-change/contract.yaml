uncertainties:
- A blocked change surfaces no message to the user or to Claude, whether it is blocked by reason or by exit-2 stderr; Claude Code writes only a debug-log line.
- policy_settings changes cannot be blocked; blocking decisions for them are ignored.
- systemMessage and continue are discarded.
- Exit status 2 is described only by the exact exit-2 outcomes; the 1-255 nonzero outcomes model the reference's other exit codes and apply to status 2 only where no exit-2 outcome exists.
