uncertainties:
- A command hook returns the path as the last non-empty stdout line after Claude Code strips ANSI escape codes, so earlier lines such as shell banners are ignored; a command hook cannot return JSON, so terminalSequence is unavailable to it.
- A relative path is resolved against the directory the hook ran in, collapsing . and .. segments. An absolute path that contains . or .. segments, or any path that passes through a symlink below the repository root, is refused (Claude Code v2.1.216 or later).
- If the resolved path is not a directory Claude Code can enter, the session prints an error naming the path and exits with code 1.
- Claude Code acts on the hook's success and returned path and discards systemMessage and continue. A failed HTTP hook, or a 2xx response without worktreePath, fails creation under the same contract as a command hook.
- Configuring the hook replaces the default git worktree behavior, so .worktreeinclude is not processed.
