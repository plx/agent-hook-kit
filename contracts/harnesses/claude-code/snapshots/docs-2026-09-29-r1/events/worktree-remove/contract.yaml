uncertainties:
- 'Claude Code reads only the exit code: exit 0 counts as removed, and a nonzero exit fails the removal when worktree_path still exists afterward, leaving the worktree on disk with no git fallback.'
- The reference says Claude Code reads nothing else from the hook and discards its JSON output fields, so stdout is modeled as ignored; the general statement that terminalSequence still fires on discarding events is not restated for WorktreeRemove.
- A failed removal writes the hook command and stderr to the debug log; agent view quotes the start of stderr when a background-session delete is refused.
- An HTTP hook applies the same failure contract. Without any WorktreeRemove hook, Claude Code falls back to git worktree remove --force on the WorktreeCreate path.
