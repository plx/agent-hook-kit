format_version: 1
id: antigravity/docs-2026-09-30-r1/PreToolUse
harness: antigravity
snapshot: docs-2026-09-30-r1
event:
  wire_name: PreToolUse
  rust_key: pre_tool_use
  category: tool
  identification:
    inferability: ambiguous
    overlaps: [PostToolUse]
schemas:
  input:
    file: input.schema.json
    origin: derived
    sources: [antigravity-hooks-reference, antigravity-hooks-markdown, antigravity-changelog, antigravity-cli-changelog, antigravity-hooks-archive-2026-08-16]
    assurance: { confidence: low, verification: source-reviewed }
  outputs:
    - id: command-response
      file: output.command.schema.json
      origin: derived
      sources: [antigravity-hooks-reference, antigravity-hooks-markdown, antigravity-permissions-reference]
      assurance: { confidence: low, verification: source-reviewed }
bindings:
  command:
    kind: process
    request: { channel: stdin, framing: single-document-at-eof, content_kind: json }
    outcomes:
      - id: decision
        effect: control
        exit: { exact: 0 }
        stdout: { presence: required, role: protocol-value, content_kind: json }
        stderr: { presence: optional, role: diagnostics, content_kind: text, encoding: utf-8 }
        output_schema: command-response
        sources: [antigravity-hooks-reference, antigravity-hooks-markdown]
        assurance: { confidence: low, verification: source-reviewed }
handler_kinds: [command]
fixtures: fixtures.yaml
uncertainties:
  - "The reference still does not specify nonzero-exit, timeout, or invalid-stdout behavior, so no failure outcome is modelled. Antigravity 2.0 v2.12.0 release notes say a failing custom hook no longer ends the session and is reported as an error while the conversation continues; 'failing' is undefined, the CLI and IDE notes have no counterpart, and earlier 2.0 builds ended the session."
  - "What happens to the pending tool call after a failing PreToolUse hook is undocumented. Do not presume fail-open: CLI 1.1.7 notes that a broken plugin hook could break file-editing tools."
  - "modelName is listed among the common input fields and appears in every official example, but it was first documented between the 2026-07-21 and 2026-08-16 archive captures, was absent from docs-2026-08-04-r1 and from every IDE-specific copy, and no release note dates it. It is optional so that payloads from earlier builds, and possibly the IDE v2.5.5 build, still validate."
  - "workspacePaths may be an empty array. The reference sets no minimum, and release notes describe conversations without a workspace (CLI 1.2.2, 2.0 v2.14.0 standalone conversations) while global hooks load from ~/.gemini/config/hooks.json. Whether such payloads send [] or omit the field is undocumented, so the field stays required."
  - "transcriptPath and artifactDirectoryPath are described as absolute paths, but every official example uses a literal ~/ prefix; the schema does not require an absolute or expanded path."
  - "stepIdx is the 0-based index of the current step in the whole conversation trajectory, not an index within the current model invocation."
  - "The reference defines allow as automatically allowing the tool call and documents no pass-through or no-objection decision. CLI 1.0.16 handles empty decision strings without error, but their effect is undocumented, so the output schema does not admit an empty decision."
  - "The superseded IDE-specific reference listed decisions only up to force_ask. The unified reference applies deny_unless_prior_grant to all three surfaces, but the IDE build (v2.5.5, 2026-08-13) has not been re-released since that copy was withdrawn."
  - "permissionOverrides entries use the action(target) permission-resource vocabulary of the permissions reference (read_file, write_file, read_url, execute_url, command with prefix, regex:, or * targets, and mcp); the schema keeps them open strings, and uniqueItems is a HookKit emission rule rather than an upstream requirement."
  - "reason is shown to the agent or user; CLI 1.1.28 adds it as a Reason line in tool-approval prompts."
  - "toolCall.args is typed as an object, but the reference also documents a tool without arguments (list_permissions, Arguments: None) and never shows how such a call encodes them. Whether Antigravity then sends {}, null, or no args member is undocumented, so args is optional and nullable; a hook should treat a missing or null args as an empty object."
  - "toolCall.name and toolCall.args stay open. The reference lists 20 built-in tools, but release notes mention others (manage_inbox, read_resource, browser_* tools), Antigravity 2.0 v2.11.0 added StartPage, EndPage, and MediaResolution arguments to view_file that the reference does not list, and CLI 1.2.7 retired find_by_name, grep_search, and list_dir from the default toolset."
  - "The reference supports only command handlers. Release notes mention prompt hooks (CLI 1.1.23) and hooks that call a model (2.0 v2.6.0) that the reference does not document, so they are not inventoried."
