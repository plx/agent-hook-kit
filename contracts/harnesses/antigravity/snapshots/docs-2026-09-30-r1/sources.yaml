    reproducibility: content-hash-only
    limitations:
      - The former IDE-specific hook reference is a 371-byte meta-refresh redirect to /docs/hooks?tab=ide. The server sends it gzip-encoded; the recorded hash covers the decoded body.
  - id: antigravity-changelog
    kind: official-documentation
    authority: primary
    url: https://antigravity.google/docs/changelog.md
    retrieved: 2026-09-30
    revision: 'site build ETag "_KFTNQ"'
    content_sha256: 404ef735cb652cefd51649855e83809b0f17d50d91926d5b0bf3d27acb681b8a
    reproducibility: content-hash-only
    limitations:
      - Combined release notes for Antigravity 2.0 through v2.18.1, CLI through v1.2.11, SDK through v0.1.18, and IDE through v2.5.5 (2026-08-13), with no checked-in capture; the hash covers the decoded 268410-byte body returned by `curl --compressed`.
      - Release notes describe runtime behavior in prose only and define neither hook exit codes nor payload schemas.
  - id: antigravity-cli-changelog
    kind: official-documentation
    authority: primary
    url: https://raw.githubusercontent.com/google-antigravity/antigravity-cli/eaf9e06660d2ca8f20f1474ed03f10e3dbfd35e5/CHANGELOG.md
    retrieved: 2026-09-30
    revision: eaf9e06660d2ca8f20f1474ed03f10e3dbfd35e5
    content_sha256: 09edf2e8af87f1788348e4ec62e9d2ab26f9f90cfc48fca54dc0e14fe9c31d2b
    reproducibility: pinned-revision
    limitations:
      - CLI release notes through 1.2.14, not vendored. The URL names the raw file at the pinned commit, so `curl --compressed <url>` reproduces the recorded hash; docs-2026-09-29-r1 recorded the GitHub blob page for the same file, whose HTML never hashes the same twice.
      - The pinned commit was still the head of main on 2026-09-30.
  - id: antigravity-permissions-reference
