    limitations:
      - Internet Archive capture (original bytes, 126873) and the first archived generic reference that lists modelName; no capture exists between 2026-07-21 and this one, so the day modelName was documented is unknown.
  - id: antigravity-ide-hooks-archive-2026-09-16
    kind: archived-official-documentation
    authority: secondary
    url: https://web.archive.org/web/20260916032838id_/https://antigravity.google/docs/ide/hooks
    retrieved: 2026-09-30
    content_sha256: 52752e77383aa12d06bd70e875deff15e2c562833cf31322946677d3be709dce
    reproducibility: content-hash-only
    limitations:
      - Internet Archive capture (original bytes, 128311) and the last archived IDE-specific reference before it became a redirect. Like every IDE copy archived from 2026-07-21 onward, it documents PostToolUse input without toolCall, PreToolUse decisions without deny_unless_prior_grant, and no modelName, although the latest IDE release (v2.5.5) predates it.
