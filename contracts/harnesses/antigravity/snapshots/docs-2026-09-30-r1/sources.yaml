    limitations:
      - Internet Archive capture (original bytes, 140496) of the generic reference as last archived before docs-2026-08-04-r1. It documents no modelName, no PostToolUse toolCall, and no deny_unless_prior_grant, and says PostInvocation fires after tool calls finish.
  - id: antigravity-hooks-archive-2026-08-16
