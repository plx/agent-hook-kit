    limitations:
      - Defines the `action(target)` permission-resource vocabulary used by PreToolUse `permissionOverrides`; no checked-in capture. The hash covers the decoded 26356-byte body returned by `curl --compressed`.
  - id: antigravity-hooks-archive-2026-07-21
