format_version: 1
sources:
  - id: antigravity-hooks-reference
    kind: official-documentation
    authority: primary
    url: https://antigravity.google/docs/hooks
    retrieved: 2026-09-30
    revision: 'site build ETag "_KFTNQ"'
    content_sha256: 051967919edfb9904511c9a47e65115cb3def61c34f6f7e14924710df215f180
    reproducibility: content-hash-only
    limitations:
      - The unified Antigravity 2.0, CLI, and IDE hook reference is a mutable rendered page with site chrome and no checked-in capture; the hash covers the decoded 141741-byte HTML body returned by `curl --fail --silent --show-error --location --compressed` on 2026-09-30, byte-identical to the docs-2026-09-29-r1 evidence.
      - The ETag is shared by every page of the documentation site, so it identifies a site build rather than a page revision.
      - The `?tab=ide` variant returns identical bytes; the surface tabs differ only in hook configuration locations and the `<app_data_dir>` value, not in the input/output contract.
  - id: antigravity-hooks-markdown
    kind: official-documentation
    authority: primary
    url: https://antigravity.google/docs/hooks.md
    retrieved: 2026-09-30
    revision: 'site build ETag "_KFTNQ"'
    content_sha256: c1ce644786c46a666379af40e3983081887fa29245ead461be4235a92ffc80c3
    reproducibility: content-hash-only
    limitations:
      - Official Markdown source of the unified hook reference, with no checked-in capture. The server intermittently applies gzip content encoding even when no Accept-Encoding header is sent; the hash covers the decoded 16795-byte identity body, which `curl --compressed` reproduces.
      - 'It types `toolCall.args` as an object but documents `list_permissions` with "Arguments: None" and shows no payload for an argument-less call, which the PreToolUse and PostToolUse contracts record.'
  - id: antigravity-ide-hooks-redirect
