format_version: 1
id: antigravity/docs-2026-11-25-r1/Stop
harness: antigravity
snapshot: docs-2026-11-25-r1
event:
  wire_name: Stop
  rust_key: stop
  category: turn
  identification:
    inferability: shape-based
    overlaps: [SessionStart]
schemas:
  input:
    file: input.schema.json
    origin: derived
    sources: [antigravity-hooks-reference, antigravity-hooks-markdown, antigravity-changelog, antigravity-cli-changelog, antigravity-hooks-archive-2026-08-16]
    assurance: { confidence: low, verification: source-reviewed }
  outputs:
    - id: command-response
      file: output.command.schema.json
      origin: derived
      sources: [antigravity-hooks-reference, antigravity-hooks-markdown, antigravity-changelog, antigravity-cli-changelog, antigravity-build-plugins]
      assurance: { confidence: low, verification: source-reviewed }
bindings:
  command:
    kind: process
    request: { channel: stdin, framing: single-document-at-eof, content_kind: json }
    outcomes:
      - id: decision
        effect: stop-or-continue
        exit: { exact: 0 }
        stdout: { presence: required, role: protocol-value, content_kind: json }
        stderr: { presence: optional, role: diagnostics, content_kind: text, encoding: utf-8 }
        output_schema: command-response
        sources: [antigravity-hooks-reference, antigravity-hooks-markdown, antigravity-changelog, antigravity-cli-changelog]
        assurance: { confidence: low, verification: source-reviewed }
      - id: failure
        effect: nonblocking-error
        exit: { range: { min: 1, max: 255 } }
        stdout: { presence: optional, role: ignored, content_kind: opaque }
        stderr: { presence: optional, role: ignored, content_kind: opaque }
        sources: [antigravity-build-plugins, antigravity-cli-changelog, antigravity-changelog]
        assurance: { confidence: low, verification: source-reviewed }
handler_kinds: [command]
fixtures: fixtures.yaml
uncertainties:
  - "The reference requires decision but specifies only continue; all other values allow stopping."
  - "build-plugins.md says a Stop hook may return {} to allow the stop, while the reference marks decision Required and says any value other than continue allows the stop. The runtime effect of {} is plausibly the same, but the stated requirement differs, so HookKit keeps decision required as an emission rule and rejects {} (the empty-object output negative). Whether {} allows the stop silently or counts as a hook error is undocumented."
  - "continue is not a hard gate. CLI 1.1.9 ends the turn normally after a configurable number of consecutive continuations, and Antigravity App v2.6.0 finishes the turn after repeated blocks; the limit, its configuration key, and any IDE behavior are undocumented."
  - "CLI 1.5.6 added a continuation_active input field that is true while the agent is already working on a continuation an earlier Stop hook requested, so a hook can avoid looping. The reference does not document it and says field names use camelCase, while every release-note mention spells it in snake_case, so the wire key is unobserved: a camelCase continuationActive stays accepted as an additional property. Absence means unknown, not false, and whether the App, IDE, or IDE extensions send it is undocumented."
  - "reason is defined only when decision is continue, where it is injected as a system message; whether it is surfaced or logged with any other decision is undocumented."
  - "From CLI 1.3.3, /btw side questions run no user or workspace hooks, so a Stop hook does not see them."
  - "The failure outcome rests on build-plugins.md, which says a plugin command hook must exit 0 with a JSON response and that any non-zero exit is logged as a hook execution error and ignored (failing open), so a failing Stop hook allows the stop. Fail-open is inferred, not documented, for workspace and global hooks and for the App and IDE; the hooks reference itself defines no exit codes, and exit 2 has no special meaning. Antigravity App v2.12.0 reports a failing custom hook as an error and continues the conversation, where earlier builds ended the session."
  - "Invalid stdout at exit 0 is documented as ignored only for PostToolUse (CLI 1.4.3). The default handler timeout is 30 seconds (60 seconds for hooks converted by agy plugin import, CLI 1.5.5), and from CLI 1.5.14 a timed-out or canceled hook's whole process group is terminated on Linux and macOS. CLI 1.5.8 fixed Windows hook commands containing double quotes that failed to run and were silently skipped."
  - "error is optional and documented for terminations caused by a system error, but the official example sends an empty string with terminationReason model_stop, so an empty string means no error."
  - "terminationReason is an open string; the reference gives model_stop, max_steps_exceeded, and error only as examples."
  - "modelName is listed among the common input fields and appears in every official example, but it was first documented between the 2026-07-21 and 2026-08-16 archive captures, was absent from docs-2026-08-04-r1 and from every IDE-specific copy, and no release note dates it. It stays optional so that payloads from earlier builds and from IDE v2.5.5 and earlier still validate. Before CLI 1.5.3 a session using a custom model sent a placeholder or empty modelName, so a blank value means unknown rather than a model id."
  - "lastUserInput is a documented common field (the most recent user prompt), added to hook stdin by CLI 1.4.7; Antigravity App v2.28.0 says hooks now receive the current user message without naming the key. It is optional because earlier builds, and the IDE and IDE extensions for which no note mentions it, may omit it, and the official Stop example omits it."
  - "hookEventName and cwd were added to hook input by CLI 1.5.4 according to its release notes; the reference does not document them. They are optional strings, no App, IDE, or IDE-extension note mentions them, and whether hookEventName uses the PascalCase event names is undocumented. The JSON cwd is the agent's working directory, which can differ from the hook process's working directory (the plugin root for plugin hooks)."
  - "Stop is identified by its required executionNum, terminationReason, and fullyIdle fields. Its payload also satisfies the common-fields-only SessionStart schema, but no documented SessionStart payload carries those fields, so a payload that satisfies Stop is presumed to be Stop. hookEventName (CLI 1.5.4 and later) is undocumented in the reference and cannot be a catalog discriminator."
  - "workspacePaths may be an empty array. The reference sets no minimum, and release notes describe conversations without a workspace (CLI 1.2.2, Antigravity App v2.14.0 standalone conversations) while global hooks load from ~/.gemini/config/hooks.json. Whether such payloads send [] or omit the field is undocumented, so the field stays required."
  - "transcriptPath and artifactDirectoryPath are described as absolute paths, but every official example uses a literal ~/ prefix; the schema does not require an absolute or expanded path."
  - "<app_data_dir> is documented only for the App (~/.gemini/antigravity), the CLI (~/.gemini/antigravity-cli), and the IDE (~/.gemini/antigravity-ide). IDE extensions have none: the ACP-based JetBrains, Zed, and Xcode extensions store conversation artifacts under <GEMINI_HOME>/antigravity-acp (v1.0.0), which may or may not be their payload <app_data_dir>, and their v1.5.0 multi-root support may send several workspacePaths. mcp.md resolves the IDE's <app-data-dir> to ~/.gemini/antigravity (for its MCP schema cache), contradicting the hooks reference's ~/.gemini/antigravity-ide. The schemas constrain no path prefix."
  - "The reference supports only command handlers: type is optional, 'Currently only command is supported', and defaults to command, and build-plugins.md speaks of command hooks. plugins.md and build-plugins.md describe lifecycle hooks as 'shell commands or prompt evaluations', and release notes mention prompt hooks (CLI 1.1.23) and hooks that call a model (Antigravity App v2.6.0), but no prompt handler is documented, so none is inventoried."
