[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/hookkit-core",
    "crates/hookkit-runtime",
    "crates/hookkit-claude",
    "crates/hookkit-codex",
    "crates/hookkit-antigravity",
    "crates/hookkit-conformance",
    "crates/hookkit-common",
    "crates/hookkit-shell",
    "crates/hookkit-tool-access",
    "crates/hookkit-file-activity",
    "crates/hookkit-session-state",
    "examples/codex-bash-guard",
    "examples/claude-sessionstart-context",
    "examples/shared-posttool-autofix",
    "examples/antigravity-pre-invocation",
    "examples/codex-claude-rules",
    "examples/forbidden-file-guard",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/plx/agent-hook-kit"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
camino = { version = "1", features = ["serde1"] }
dirs = "6"
# 0.4.19+ raised the crate's MSRV above HookKit's Rust 1.85 baseline.
globset = "=0.4.18"
toml = "0.8"
walkdir = "2"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
jsonschema = { version = "0.47", default-features = false }
serde_yaml_ng = "0.10"
sha2 = "0.11"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.0"
proptest = "1.11.0"

# workspace crates
hookkit-core = { version = "0.1.0", path = "crates/hookkit-core" }
hookkit-runtime = { version = "0.1.0", path = "crates/hookkit-runtime" }
hookkit-claude = { version = "0.1.0", path = "crates/hookkit-claude" }
hookkit-codex = { version = "0.1.0", path = "crates/hookkit-codex" }
hookkit-antigravity = { version = "0.1.0", path = "crates/hookkit-antigravity" }
hookkit-common = { version = "0.1.0", path = "crates/hookkit-common" }
hookkit-shell = { version = "0.1.0", path = "crates/hookkit-shell" }
hookkit-tool-access = { version = "0.1.0", path = "crates/hookkit-tool-access" }
hookkit-file-activity = { version = "0.1.0", path = "crates/hookkit-file-activity" }
hookkit-session-state = { version = "0.1.0", path = "crates/hookkit-session-state" }
