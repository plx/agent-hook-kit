accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[zmij]
accepted = ["MIT"]

[memchr]
accepted = ["MIT"]

[unicode-ident]
accepted = ["MIT", "Unicode-3.0"]

# `option-ext` is a small utility helper pulled in transitively by `dirs` →
# `dirs-sys`. MPL-2.0 is file-scoped copyleft and compatible with our
# MIT-or-Apache-2.0 distribution as long as the upstream `option-ext` source
# files retain their MPL-2.0 notice (which they do, since we don't vendor or
# modify them — they're consumed as a normal crates.io dependency).
[option-ext]
accepted = ["MPL-2.0"]

# `minijinja` ships its top-level Apache-2.0 LICENSE plus a vendored copy of
# `self_cell`'s LICENSE at `src/vendor/self_cell/LICENSE`. cargo-about's
# filesystem-order scan picks different ones on macOS vs. Linux CI, producing
# a different deduplication grouping each time. Clarify it to the top-level
# LICENSE so the output is deterministic across platforms.
[minijinja.clarify]
license = "Apache-2.0"

[[minijinja.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"
