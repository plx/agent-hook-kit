name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-push-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint, test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Contract catalog
        run: |
          cargo xtask contracts check --snapshot current
          cargo xtask contracts report --check
          cargo xtask contracts verify-vendor
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Hermetic workspace tests
        run: cargo test --workspace
      - name: Hermetic runner fake-tool smoke
        if: runner.os != 'Windows'
        run: cargo test -p hookkit-tool-runner --lib hermetic_fake_executable_smoke

  licenses:
    name: Third-party license attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned in lockstep with scripts/regen-licenses.sh.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0
      - name: Regenerate THIRD_PARTY_LICENSES.md
        run: scripts/regen-licenses.sh
      - name: Verify committed file is up to date
        run: |
          if ! git diff --exit-code -- THIRD_PARTY_LICENSES.md; then
            echo "::error file=THIRD_PARTY_LICENSES.md::Out of date. Run scripts/regen-licenses.sh locally and commit the result." >&2
            exit 1
          fi
