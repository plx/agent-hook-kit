name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-push-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.85 libraries and runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check supported packages on the declared MSRV
        run: >-
          cargo check
          -p hookkit-core
          -p hookkit-claude
          -p hookkit-codex
          -p hookkit-antigravity
          -p hookkit-session-state
          -p hookkit-pkl-config
          -p hookkit-common
          -p hookkit-shell
          -p hookkit-tool-access
          -p hookkit-file-activity
          -p hookkit-runtime
          -p hookkit-tool-runner
          --all-targets

  check:
    name: Check, lint, test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Contract catalog
        run: |
          cargo run --quiet -p hookkit-conformance
          cargo run --quiet -p xtask --bin generate-claude-contracts
          cargo run --quiet -p xtask --bin generate-codex-contracts
          cargo xtask contracts check --snapshot current
          cargo xtask contracts report --check
          cargo xtask contracts verify-vendor
          git diff --exit-code -- contracts
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Hermetic workspace tests
        run: cargo test --workspace
      - name: Hermetic runner fake-tool smoke
        if: runner.os != 'Windows'
        run: cargo test -p hookkit-tool-runner --lib hermetic_fake_executable_smoke
      - name: Verify publishable package archives
        run: |
          for package in hookkit-core hookkit-claude hookkit-codex hookkit-antigravity hookkit-session-state hookkit-pkl-config hookkit-common hookkit-shell hookkit-tool-access hookkit-file-activity hookkit-runtime hookkit-tool-runner; do
            cargo package -p "$package" --list >/dev/null
          done
          cargo package -p hookkit-core

  template:
    name: Copier catalog and generated-project matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: Validate template catalogs
        run: cargo xtask template-catalog check
      - name: Install Pkl 0.31.1
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/pkl" \
            https://github.com/apple/pkl/releases/download/0.31.1/pkl-linux-amd64
          chmod +x "$RUNNER_TEMP/pkl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate the full Copier matrix
        run: templates/hook-project/tests/run.sh --validation full

  licenses:
    name: Third-party license attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned in lockstep with scripts/regen-licenses.sh.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0
      - name: Regenerate THIRD_PARTY_LICENSES.md
        run: scripts/regen-licenses.sh
      - name: Verify committed file is up to date
        run: |
          if ! git diff --exit-code -- THIRD_PARTY_LICENSES.md; then
            echo "::error file=THIRD_PARTY_LICENSES.md::Out of date. Run scripts/regen-licenses.sh locally and commit the result." >&2
            exit 1
          fi
